[package]
name = "medtracker"
version = "0.1.0"
edition = "2021"
description = "Local-first medication log"

[lib]
name = "medtracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
jiff = { version = "1", default-features = false, features = ["std", "tzdb-bundle-always"] }
iana-time-zone = "0.1"
jiff-tzdb = "1"
# Encrypted backups (B2-09): RustCrypto password KDF + AEAD, pure Rust, no network, no custom crypto.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
zeroize = "1"
